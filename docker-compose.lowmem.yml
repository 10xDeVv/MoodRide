services:
  zookeeper:
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    mem_reservation: 256m
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2097152
    mem_reservation: 1g
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    mem_reservation: 768m
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 60s
    command:
      - "postgres"
      - "-c"
      - "max_connections=80"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "password_encryption=md5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    command: redis-server --requirepass redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_reservation: 128m
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_password ping | grep PONG || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  osrm-prepare:
    mem_reservation: 512m
    mem_limit: 1500m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  osrm:
    mem_reservation: 384m
    mem_limit: 1200m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


services:
  postgres:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=8"
      - "-c"
      - "max_wal_senders=8"
    networks:
      - internal

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - internal

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - internal

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - internal

  osrm:
    image: ${OSRM_IMAGE_REF:?OSRM_IMAGE_REF digest is required}
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET_BASENAME:?OSRM_DATASET_BASENAME is required}.osrm
    volumes:
      - ./data/osrm:/data:ro
    networks:
      - internal

  route-api:
    image: ${ROUTE_API_IMAGE_REF:?ROUTE_API_IMAGE_REF digest is required}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_ADMIN_PROPERTIES_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MOODRIDE_CORS_ALLOWED_ORIGINS: ${MOODRIDE_CORS_ALLOWED_ORIGINS:-https://usewayward.app,https://www.usewayward.app}
      MOODRIDE_ANALYTICS_HASH_SECRET: ${MOODRIDE_ANALYTICS_HASH_SECRET:?MOODRIDE_ANALYTICS_HASH_SECRET is required}
      MOODRIDE_SCENIC_SCORING_VERSION: ${MOODRIDE_SCENIC_SCORING_VERSION:?MOODRIDE_SCENIC_SCORING_VERSION is required}
      MOODRIDE_ROAD_DATASET_REVISION: ${MOODRIDE_ROAD_DATASET_REVISION:?MOODRIDE_ROAD_DATASET_REVISION is required}
      MOODRIDE_ROAD_DATASET_FINGERPRINT: ${MOODRIDE_ROAD_DATASET_FINGERPRINT:?MOODRIDE_ROAD_DATASET_FINGERPRINT is required}
      MOODRIDE_ROAD_ANCHOR_CACHE_SCHEMA: ${MOODRIDE_ROAD_ANCHOR_CACHE_SCHEMA:?MOODRIDE_ROAD_ANCHOR_CACHE_SCHEMA is required}
      MOODRIDE_ALGORITHM_PROFILE: ${MOODRIDE_ALGORITHM_PROFILE:?MOODRIDE_ALGORITHM_PROFILE is required}
      MOODRIDE_ALGORITHM_MODE: ${MOODRIDE_ALGORITHM_MODE:?MOODRIDE_ALGORITHM_MODE is required}
      MOODRIDE_CACHE_GRAPH_WARMUP_ENABLED: ${MOODRIDE_CACHE_GRAPH_WARMUP_ENABLED:?MOODRIDE_CACHE_GRAPH_WARMUP_ENABLED is required}
    networks:
      - internal

  route-worker:
    image: ${ROUTE_WORKER_IMAGE_REF:?ROUTE_WORKER_IMAGE_REF digest is required}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
      - osrm
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_ADMIN_PROPERTIES_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MOODRIDE_SCENIC_SCORING_VERSION: ${MOODRIDE_SCENIC_SCORING_VERSION:?MOODRIDE_SCENIC_SCORING_VERSION is required}
      MOODRIDE_ROAD_DATASET_REVISION: ${MOODRIDE_ROAD_DATASET_REVISION:?MOODRIDE_ROAD_DATASET_REVISION is required}
      MOODRIDE_ROAD_DATASET_FINGERPRINT: ${MOODRIDE_ROAD_DATASET_FINGERPRINT:?MOODRIDE_ROAD_DATASET_FINGERPRINT is required}
      MOODRIDE_ROAD_ANCHOR_CACHE_SCHEMA: ${MOODRIDE_ROAD_ANCHOR_CACHE_SCHEMA:?MOODRIDE_ROAD_ANCHOR_CACHE_SCHEMA is required}
      MOODRIDE_ALGORITHM_PROFILE: ${MOODRIDE_ALGORITHM_PROFILE:?MOODRIDE_ALGORITHM_PROFILE is required}
      MOODRIDE_ALGORITHM_MODE: ${MOODRIDE_ALGORITHM_MODE:?MOODRIDE_ALGORITHM_MODE is required}
      MOODRIDE_CACHE_GRAPH_WARMUP_ENABLED: ${MOODRIDE_CACHE_GRAPH_WARMUP_ENABLED:?MOODRIDE_CACHE_GRAPH_WARMUP_ENABLED is required}
      MOODRIDE_OSRM_BASE_URL: http://osrm:5000
      MOODRIDE_KAFKA_LISTENER_CONCURRENCY: ${MOODRIDE_KAFKA_LISTENER_CONCURRENCY:-3}
      MOODRIDE_ALGORITHM_OSRM_REQUEST_PARALLELISM: ${MOODRIDE_ALGORITHM_OSRM_REQUEST_PARALLELISM:-6}
    networks:
      - internal

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE_REF:?NOTIFICATION_SERVICE_IMAGE_REF digest is required}
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_ADMIN_PROPERTIES_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE_REF:?FRONTEND_IMAGE_REF digest is required}
    restart: unless-stopped
    networks:
      - internal
  caddy:
    image: ${CADDY_IMAGE_REF:?CADDY_IMAGE_REF digest is required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE_PATH:?CADDYFILE_PATH is required}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - route-api
      - notification-service
      - frontend
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
  redis_data:
  caddy_data:
  caddy_config:

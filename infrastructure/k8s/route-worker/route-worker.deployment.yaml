apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-worker
  namespace: moodride
  labels:
    app: route-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: route-worker
  template:
    metadata:
      labels:
        app: route-worker
    spec:
      containers:
        - name: route-worker
          image: moodride/route-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: route-worker-config
            - secretRef:
                name: route-worker-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"


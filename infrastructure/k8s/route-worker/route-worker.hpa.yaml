apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: route-worker-hpa
  namespace: moodride
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: route-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75


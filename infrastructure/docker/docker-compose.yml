version: '3.9'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: moodride-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodride}
      POSTGRES_USER: ${POSTGRES_USER:-moodride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodride_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - moodride-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moodride}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7.2-alpine
    container_name: moodride-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: sh -c 'redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD:-redis_password}"'
    networks:
      - moodride-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: moodride-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - moodride-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: moodride-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - moodride-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # OpenTopoData (self-hosted elevation service)
  opentopodata:
    image: ghcr.io/ajnisbet/opentopodata:v1.8.1
    container_name: moodride-opentopodata
    ports:
      - "5000:5000"
    volumes:
      - elevation_data:/app/data
    networks:
      - moodride-network
    environment:
      OPENTOPODATA_CONFIG: |
        [[datasets]]
        name = "srtm30m"
        path = "data/srtm30m/"
        filename_epsg = 4326
        filename_tile_size = 1

  # OSRM preprocessing (one-shot) and routing service
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: moodride-osrm-prepare
    command:
      - sh
      - -c
      - |
        set -e
        PBF_PATH="/data/osm/${OSRM_PBF_FILE:-new-brunswick-latest.osm.pbf}"
        DATASET_BASENAME="${OSRM_DATASET_BASENAME:-new-brunswick-latest}"
        TARGET_PBF="/data/$${DATASET_BASENAME}.osm.pbf"
        TARGET_OSRM="/data/$${DATASET_BASENAME}.osrm"
        if [ ! -f "$$PBF_PATH" ]; then
          echo "OSRM extract not found: $$PBF_PATH"
          exit 1
        fi
        if [ -f "$$TARGET_OSRM" ]; then
          echo "OSRM dataset already prepared: $$TARGET_OSRM"
          exit 0
        fi
        cp "$$PBF_PATH" "$$TARGET_PBF"
        osrm-extract -p /opt/car.lua "$$TARGET_PBF"
        osrm-partition "$$TARGET_OSRM"
        osrm-customize "$$TARGET_OSRM"
    volumes:
      - ../../data/osrm:/data
      - ../../data/osm-samples:/data/osm:ro
    networks:
      - moodride-network
    restart: "no"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: moodride-osrm
    depends_on:
      - osrm-prepare
    command:
      - sh
      - -c
      - |
        DATASET_BASENAME="${OSRM_DATASET_BASENAME:-new-brunswick-latest}"
        TARGET_OSRM="/data/$${DATASET_BASENAME}.osrm"
        until [ -f "$$TARGET_OSRM" ]; do
          echo "Waiting for OSRM dataset at $$TARGET_OSRM"
          sleep 2
        done
        exec osrm-routed --algorithm mld "$$TARGET_OSRM"
    ports:
      - "5002:5000"
    volumes:
      - ../../data/osrm:/data
    networks:
      - moodride-network
    restart: unless-stopped

  # Prometheus (metrics)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: moodride-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - moodride-network

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: moodride-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - moodride-network

networks:
  moodride-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  elevation_data:
  prometheus_data:
  grafana_data:

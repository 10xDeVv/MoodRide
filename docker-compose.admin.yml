services:
  dozzle:
    image: ${ADMIN_DOZZLE_IMAGE:-amir20/dozzle:latest}
    restart: unless-stopped
    profiles:
      - admin
    ports:
      - "127.0.0.1:${ADMIN_DOZZLE_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  cloudbeaver:
    image: ${ADMIN_CLOUDBEAVER_IMAGE:-dbeaver/cloudbeaver:latest}
    restart: unless-stopped
    profiles:
      - admin
    depends_on:
      - postgres
    environment:
      CB_SERVER_NAME: Wayward DB Browser
    ports:
      - "127.0.0.1:${ADMIN_CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - internal

volumes:
  cloudbeaver_data:

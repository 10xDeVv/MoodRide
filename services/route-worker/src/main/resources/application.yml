# Route Worker Service Configuration

spring:
  application:
    name: route-worker
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/moodride?sslmode=disable
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    
    properties:
      hibernate:
        # PostGIS enabled in database
        jdbc:
          batch_size: 20
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: route-worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      properties:
        bootstrap.servers: localhost:9092
  
  # Redis Configuration  
  redis:
    host: localhost
    port: 6379
    password: redis_password
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10

# Server Configuration
server:
  port: 8081

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Route Generation Configuration
moodride:
  algorithm:
    h3-resolution: 7
    tile-selection-ring-min: 4
    tile-selection-ring-max: 22
    tile-selection-limit: 120
    sector-count: 8
    corridor-sample-meters: 500
    max-duration-overrun-ratio: 1.15
    anchored-tile-selection-limit: 48
    max-osrm-requests-per-job: 48
    osrm-request-parallelism: 6
    osrm-early-stop-enabled: true
    osrm-early-stop-min-requests: 24
    osrm-early-stop-min-candidates: 12
  osrm:
    base-url: ${MOODRIDE_OSRM_BASE_URL:http://127.0.0.1:5002}
    request-timeout-ms: 7000
  route:
    retry:
      max-attempts: 3
  kafka:
    listener:
      group-id: route-workers
      concurrency: 2
    consumer:
      retry:
        max-attempts: 4
        initial-interval-ms: 500
        multiplier: 2.0
        max-interval-ms: 5000
  cache:
    graph-warmup:
      enabled: false
      interval-ms: 900000
      initial-delay-ms: 20000

route:
  generation:
    timeout:
      seconds: 30

# Logging Configuration
logging:
  level:
    root: INFO

# Scenic Scoring Service Configuration
spring:
  application:
    name: scenic-scoring-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/moodride?sslmode=disable
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    
    properties:
      hibernate:
        # PostGIS enabled in database
        jdbc:
          batch_size: 20
  batch:
    job:
      enabled: false
    initialize-schema: always
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      properties:
        bootstrap.servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092
      group-id: scenic-scoring-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: redis_password
    timeout: 2000ms
  
  # Flyway Configuration
  flyway:
    locations: classpath:db/migration
    out-of-order: false

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Scheduling configuration
moodride:
  elevation:
    opentopodata:
      enabled: true
      base-url: https://api.opentopodata.org
      dataset: srtm30m
      request-batch-size: 64
      segment-batch-size: 500
      connect-timeout-ms: 3000
      read-timeout-ms: 8000
  traffic:
    refresh:
      debounce-seconds: 30
      batch-size: 200
      scheduler-delay-ms: 10000
  scoring:
    schedule: "0 0 1 * * *"  # Weekly on Mondays at 1 AM UTC
    timeout-minutes: 120
    batch-size: 1000

# Logging Configuration
logging:
  level:
    root: INFO

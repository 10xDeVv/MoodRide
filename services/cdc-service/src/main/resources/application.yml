# CDC Service Configuration
spring:
  application:
    name: cdc-service
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      properties:
        bootstrap.servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092
      group-id: cdc-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: redis_password
    timeout: 2000ms

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Logging Configuration
logging:
  level:
    root: INFO

moodride:
  cdc:
    topics:
      scenic-tile: moodride.cdc.scenic_score_tiles
      road-segment: moodride.cdc.road_segments
      recompute-request: scenic.recompute.requests
      forwarded-tile-update: scenic-tile-updates
    idempotency-ttl-seconds: 86400


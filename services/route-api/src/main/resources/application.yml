# Route API Service Configuration

spring:
  application:
    name: route-api
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/moodride?sslmode=disable
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for schema management
    show-sql: false
    packages-to-scan: com.moodride.datamodels,com.moodride.routeapi
    
    properties:
      hibernate:
        # PostGIS enabled in database
        format_sql: true
        jdbc:
          batch_size: 20
  
  # Flyway Configuration
  flyway:
    locations: classpath:db/migration
    out-of-order: false
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      properties:
        bootstrap.servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: redis_password
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10

# Server Configuration
server:
  port: 8080

# Management (Actuator) Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO

moodride:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,https://usewayward.app,https://www.usewayward.app
  cache:
    warmup:
      enabled: true
      limit: 200
      interval-ms: 3600000
      initial-delay-ms: 30000


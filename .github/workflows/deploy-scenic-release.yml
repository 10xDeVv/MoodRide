name: Deploy Scenic Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag that contains the scenic data asset"
        required: true
        type: string
      scoring_version:
        description: "Exact signed 3.7 scoring version in the scenic release"
        required: true
        type: string
      asset_name:
        description: "Optional canonical asset name; must match the scoring version"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-scenic:
    name: Pull Scenic Asset and Deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate dispatch and deployment target
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SCORING_VERSION: ${{ inputs.scoring_version }}
          DISPATCH_ASSET_NAME: ${{ inputs.asset_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          set -euo pipefail
          require_single_line() {
            local name="$1"
            local value="$2"
            case "$value" in
              *$'\r'*|*$'\n'*)
                echo "$name must be a single line." >&2
                exit 1
                ;;
            esac
          }
          require_single_line release_tag "$DISPATCH_RELEASE_TAG"
          require_single_line scoring_version "$DISPATCH_SCORING_VERSION"
          require_single_line asset_name "$DISPATCH_ASSET_NAME"
          require_single_line source_sha "$SOURCE_SHA"
          require_single_line repository "$SOURCE_REPOSITORY"
          require_single_line ssh_user "$PROD_SSH_USER"
          require_single_line ssh_host "$PROD_SSH_HOST"
          printf '%s' "$DISPATCH_RELEASE_TAG" \
            | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' \
            || { echo "release_tag contains unsupported characters." >&2; exit 1; }
          printf '%s' "$DISPATCH_SCORING_VERSION" \
            | grep -Eq '^3\.7([._+-][A-Za-z0-9][A-Za-z0-9._+-]{0,45})?$' \
            || { echo "scoring_version must be an exact signed 3.7 version." >&2; exit 1; }
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "Workflow source SHA is not immutable." >&2; exit 1; }
          printf '%s' "$SOURCE_REPOSITORY" \
            | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' \
            || { echo "Repository identity is invalid." >&2; exit 1; }
          printf '%s' "$PROD_SSH_USER" \
            | grep -Eq '^[A-Za-z_][A-Za-z0-9_-]{0,31}$' \
            || { echo "Production SSH user is invalid." >&2; exit 1; }
          printf '%s' "$PROD_SSH_HOST" \
            | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$' \
            || { echo "Production SSH host is invalid." >&2; exit 1; }

          sanitized_version="$(
            printf '%s' "$DISPATCH_SCORING_VERSION" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g'
          )"
          canonical_asset_name="scenic-tiles-${sanitized_version}.tar.gz"
          printf '%s' "$canonical_asset_name" \
            | grep -Eq '^scenic-tiles-[a-z0-9][a-z0-9._-]{0,96}\.tar\.gz$' \
            || { echo "Derived scenic asset name is invalid." >&2; exit 1; }
          if [ -n "$DISPATCH_ASSET_NAME" ] \
              && [ "$DISPATCH_ASSET_NAME" != "$canonical_asset_name" ]; then
            echo "asset_name must exactly equal $canonical_asset_name." >&2
            exit 1
          fi

          release_dir="${RUNNER_TEMP}/moodride-scenic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -m 700 -d "$release_dir"
          {
            printf 'RELEASE_TAG=%s\n' "$DISPATCH_RELEASE_TAG"
            printf 'SCORING_VERSION=%s\n' "$DISPATCH_SCORING_VERSION"
            printf 'ASSET_NAME=%s\n' "$canonical_asset_name"
            printf 'RELEASE_DIR=%s\n' "$release_dir"
            printf 'SOURCE_REPOSITORY=%s\n' "$SOURCE_REPOSITORY"
            printf 'SSH_TARGET=%s@%s\n' "$PROD_SSH_USER" "$PROD_SSH_HOST"
          } >> "$GITHUB_ENV"

      - name: Download and verify published release bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --pattern "${ASSET_NAME}.sha256" \
            --dir "$RELEASE_DIR"

          asset_path="$RELEASE_DIR/$ASSET_NAME"
          sidecar_path="${asset_path}.sha256"
          [ -f "$asset_path" ] || { echo "Release asset was not downloaded." >&2; exit 1; }
          [ -f "$sidecar_path" ] || { echo "Published SHA-256 sidecar was not downloaded." >&2; exit 1; }
          [ "$(wc -l < "$sidecar_path" | tr -d '[:space:]')" = "1" ] \
            || { echo "Published SHA-256 sidecar must contain exactly one line." >&2; exit 1; }
          checksum_line="$(tr -d '\r' < "$sidecar_path")"
          printf '%s\n' "$checksum_line" \
            | grep -Eq '^[0-9a-f]{64}  [A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo "Published SHA-256 sidecar has an invalid format." >&2; exit 1; }
          published_sha256="${checksum_line%%  *}"
          published_name="${checksum_line#*  }"
          [ "$published_name" = "$ASSET_NAME" ] \
            || { echo "Published SHA-256 sidecar names a different asset." >&2; exit 1; }
          actual_asset_sha256="$(sha256sum -- "$asset_path")"
          actual_asset_sha256="${actual_asset_sha256%% *}"
          [ "$actual_asset_sha256" = "$published_sha256" ] \
            || { echo "Downloaded scenic asset failed published SHA-256 verification." >&2; exit 1; }

          script_path="scripts/deploy/deploy_scenic_release.sh"
          actual_script_sha256="$(sha256sum -- "$script_path")"
          actual_script_sha256="${actual_script_sha256%% *}"
          printf '%s' "$actual_script_sha256" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "Could not identify exact scenic control bytes." >&2; exit 1; }
          {
            printf 'ASSET_SHA256=%s\n' "$published_sha256"
            printf 'SCRIPT_SHA256=%s\n' "$actual_script_sha256"
          } >> "$GITHUB_ENV"

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload checksum-addressed scenic bytes
        shell: bash
        run: |
          set -euo pipefail
          remote_stage="/tmp/moodride-scenic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v create_stage 'umask 077; mkdir -p -- %q' "$remote_stage"
          ssh "$SSH_TARGET" "$create_stage"
          scp "$RELEASE_DIR/$ASSET_NAME" \
            "${SSH_TARGET}:${remote_stage}/${ASSET_NAME}"
          scp scripts/deploy/deploy_scenic_release.sh \
            "${SSH_TARGET}:${remote_stage}/deploy_scenic_release.${SCRIPT_SHA256}.sh"

          printf -v remote_command 'bash -s -- %q %q %q %q %q' \
            "$remote_stage" "$ASSET_NAME" "$ASSET_SHA256" \
            "$SCRIPT_SHA256" "$SCORING_VERSION"
          ssh "$SSH_TARGET" "$remote_command" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          asset_name="$2"
          asset_sha256="$3"
          script_sha256="$4"
          scoring_version="$5"
          for remote_value in \
            "$stage" "$asset_name" "$asset_sha256" "$script_sha256" "$scoring_version"; do
            case "$remote_value" in
              *$'\r'*|*$'\n'*)
                echo "Remote scenic argument must be a single line." >&2
                exit 1
                ;;
            esac
          done
          printf '%s' "$stage" \
            | grep -Eq '^/tmp/moodride-scenic-[0-9]+-[0-9]+$' \
            || { echo "Remote staging path is invalid." >&2; exit 1; }
          printf '%s' "$asset_name" \
            | grep -Eq '^scenic-tiles-[a-z0-9][a-z0-9._-]{0,96}\.tar\.gz$' \
            || { echo "Remote asset name is invalid." >&2; exit 1; }
          printf '%s' "$asset_sha256" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "Remote asset SHA-256 is invalid." >&2; exit 1; }
          printf '%s' "$script_sha256" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "Remote control SHA-256 is invalid." >&2; exit 1; }
          printf '%s' "$scoring_version" \
            | grep -Eq '^3\.7([._+-][A-Za-z0-9][A-Za-z0-9._+-]{0,45})?$' \
            || { echo "Remote scoring version is invalid." >&2; exit 1; }
          trap 'rm -rf -- "$stage"' EXIT

          asset_source="$stage/$asset_name"
          script_source="$stage/deploy_scenic_release.${script_sha256}.sh"
          [ -f "$asset_source" ] && [ -f "$script_source" ] \
            || { echo "Remote scenic staging is incomplete." >&2; exit 1; }
          received_asset_sha256="$(sha256sum -- "$asset_source")"
          received_asset_sha256="${received_asset_sha256%% *}"
          received_script_sha256="$(sha256sum -- "$script_source")"
          received_script_sha256="${received_script_sha256%% *}"
          [ "$received_asset_sha256" = "$asset_sha256" ] \
            || { echo "Scenic asset changed during transport." >&2; exit 1; }
          [ "$received_script_sha256" = "$script_sha256" ] \
            || { echo "Scenic control script changed during transport." >&2; exit 1; }

          asset_dir="/opt/moodride/data/releases/scenic-assets/$asset_sha256"
          control_dir="/opt/moodride/.deploy/scenic-controls/$script_sha256"
          install -m 700 -d "$asset_dir" "$control_dir"
          asset_path="$asset_dir/$asset_name"
          control_path="$control_dir/deploy_scenic_release.sh"
          if [ ! -e "$asset_path" ]; then
            asset_temp="${asset_path}.tmp.$$"
            install -m 600 "$asset_source" "$asset_temp"
            mv -n "$asset_temp" "$asset_path"
            rm -f -- "$asset_temp"
          fi
          cmp -s "$asset_source" "$asset_path" \
            || { echo "Immutable scenic asset path has divergent bytes." >&2; exit 1; }
          if [ ! -e "$control_path" ]; then
            control_temp="${control_path}.tmp.$$"
            install -m 700 "$script_source" "$control_temp"
            mv -n "$control_temp" "$control_path"
            rm -f -- "$control_temp"
          fi
          cmp -s "$script_source" "$control_path" \
            || { echo "Immutable scenic control path has divergent bytes." >&2; exit 1; }
          [ "$(sha256sum -- "$asset_path" | cut -d" " -f1)" = "$asset_sha256" ] \
            || { echo "Installed scenic asset identity is invalid." >&2; exit 1; }
          [ "$(sha256sum -- "$control_path" | cut -d" " -f1)" = "$script_sha256" ] \
            || { echo "Installed scenic control identity is invalid." >&2; exit 1; }
          rm -rf -- "$stage"
          trap - EXIT
          exec "$control_path" \
            --asset "$asset_path" \
            --asset-sha256 "$asset_sha256" \
            --scoring-version "$scoring_version"
          REMOTE
